<!doctype html><html lang="de"><meta charset="utf-8"><title>Ambilight Sender</title>
<body style="background:#111;color:white;font:24px sans-serif"><p id="state">Ambilight wird gestartet …</p>
<script>
window.onload = function () {
    tizen.application.launch('ambiSend40.Service', function () {
        tizen.application.getCurrentApplication().hide();
    }, function () { document.getElementById('state').textContent = 'Der Dienst konnte nicht gestartet werden. Mit Zurück schließen.'; });
    document.addEventListener('tizenhwkey', function (event) {
        if (event.keyName === 'back') tizen.application.getCurrentApplication().exit();
    });
};
</script></body></html>
