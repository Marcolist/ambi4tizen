[env:ambilight]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel@1.12.3
build_flags =
    -DAMBI_PRIVATE_CONFIG=1
    -DESP_PLATFORM
    -DARDUINO_LOOP_STACK_SIZE=8192
    -I src
    -I src/mode_manager
    -I src/diagnostics
    -I src/ambilight_receiver
    -I src/configuration
    -I src/led_driver
    -I src/color_engine
